services:
  # Backend: FastAPI
  - type: web
    name: pe-orgair-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_DATABASE
        value: PE_ORGAIR
      - key: SNOWFLAKE_SCHEMA
        value: PUBLIC
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: pe-orgair-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: pe-orgair-redis
          property: port
  
  # Frontend: Streamlit
  - type: web
    name: pe-orgair-ui
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_ui/home.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: pe-orgair-api
          envVarKey: RENDER_EXTERNAL_URL

# Redis cache
databases:
  - name: pe-orgair-redis
    plan: free
    ipAllowList: []